name: Build and push Docker image

# Запускается только при изменениях в папке src
on:
  push:
    paths:
      - 'src/**'

concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build, checkstyle, push image to Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'
          cache: maven

      - name: Build project
        run: ./mvnw -B -ntp package -DskipTests

      - name: Checkstyle
        run: ./mvnw -B -ntp checkstyle:check

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image (tag = commit hash)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/nbank-tests:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image summary
        run: echo "Pushed ${{ secrets.DOCKERHUB_USERNAME }}/nbank-tests:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
