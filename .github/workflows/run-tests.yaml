name: Run tests

on: [ push, workflow_dispatch ]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-tests:
    name: Set up services (review apps) and run tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: nbank-test-environment:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests
        env:
          TEST_IMAGE: nbank-test-environment
          SKIP_BUILD: 1
          KEEP_ENV: 1
        run: |
          chmod +x run-tests-with-docker-compose.sh
          ./run-tests-with-docker-compose.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results
          if-no-files-found: ignore

      - name: Dump docker compose logs on failure
        if: failure()
        run: docker compose -f infra/docker_compose/docker-compose.yml logs --no-color --tail 200
