services:
  backend:
    image: nobugsme/nbank:with_fraud_check_with_transfer_fix
    container_name: nbank-backend
    ports:
      - "4111:4111"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/nbank
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - FRAUD_DETECTION_SERVICE_URL=http://wiremock:8080
    depends_on:
      postgres:
        condition: service_healthy
      wiremock:
        condition: service_started
    restart: unless-stopped
    networks:
      - nbank-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4111/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:15-alpine
    container_name: nbank-postgres
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=nbank
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nbank-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nbank"]
      interval: 10s
      timeout: 5s
      retries: 5

  wiremock:
    image: wiremock/wiremock:latest
    container_name: nbank-wiremock
    ports:
      - "8080:8080"
    volumes:
      - ./wiremock:/home/wiremock
    command: --global-response-templating --disable-gzip
    networks:
      - nbank-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/__admin/health"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  nbank-network:
    name: nbank-network
    driver: bridge

volumes:
  postgres_data:
    driver: local